name: Build Grok with MyJio Config

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ReSukiSU Source
        uses: actions/checkout@v4
        with:
          repository: 'rsuntk/KernelSU'
          ref: 'main'
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Build WebUI
        working-directory: manager
        run: |
          npm install -g pnpm
          pnpm install || true
          pnpm build || true

      - name: Patch Package Name and Display Labels
        working-directory: manager
        run: |
          # 1. Package Name ko ai.x.grok karna
          sed -i 's/applicationId = "me.weishu.kernelsu"/applicationId = "ai.x.grok"/g' app/build.gradle.kts || true
          
          # 2. Display Name ko Grok karna
          find app/src/main/res/ -name "strings.xml" -exec sed -i 's/>KernelSU</>Grok</g' {} + || true
          find app/src/main/res/ -name "strings.xml" -exec sed -i 's/"app_name">.*</"app_name">Grok</g' {} + || true

      - name: Generate Key with Exact My Jio Identity
        run: |
          keytool -genkeypair -v \
            -keystore myjio_clone.keystore \
            -alias jioalias \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "grokpass123" \
            -keypass "grokpass123" \
            -dname "CN=My Jio, OU=My Jio, O=My Jio, L=Mumbai, ST=Maharashtra, C=IN"

      - name: Build APK
        working-directory: manager
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Sign APK with V2 Scheme
        run: |
          SRC_APK=$(find manager/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          $ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner sign \
            --ks myjio_clone.keystore \
            --ks-pass pass:grokpass123 \
            --key-pass pass:grokpass123 \
            --ks-key-alias jioalias \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled false \
            --out Grok-Custom.apk \
            "$SRC_APK"

      - name: Output Signature Details
        run: |
          echo "=== APK SIGNATURE DETAILS ==="
          $ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner verify --print-certs Grok-Custom.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Grok-Manager-APK
          path: Grok-Custom.apk
          
