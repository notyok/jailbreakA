name: Build Grok ReSukiSU Native

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ReSukiSU Code
        uses: actions/checkout@v4
        with:
          repository: 'rsuntk/KernelSU'
          ref: 'main'
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Build WebUI
        working-directory: manager
        run: |
          npm install -g pnpm
          pnpm install || true
          pnpm build || true

      - name: Patch Package and Name to Grok
        working-directory: manager
        run: |
          # Strings me display name Grok karein
          find app/src/main/res/ -name "strings.xml" -exec sed -i 's/>KernelSU</>Grok</g' {} + || true
          find app/src/main/res/ -name "strings.xml" -exec sed -i 's/"app_name">KernelSU</"app_name">Grok</g' {} + || true

      - name: Build Official Debug Signed APK
        working-directory: manager
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload Grok Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Grok-Native-Debug
          path: manager/app/build/outputs/apk/debug/*.apk
          
